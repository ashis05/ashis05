name: stats

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/make_profile.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build profile.svg
        env:
          # Optional: add a PROFILE_TOKEN secret (fine-grained, read-only) to count private contributions.
          # Without it the built-in token only sees public activity.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          python3 scripts/make_profile.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- profile.svg; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile.svg
            git commit -m "stats: refresh profile.svg"
            git push
          fi
