<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Ashis Wadhwani. Software developer, DevOps and platform engineer.">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1915"/>
      <stop offset="0.72" stop-color="#1d1915"/>
      <stop offset="1" stop-color="#2a251f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e9e0d0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#fade)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- blueprint rails and crosshairs, like the site -->
  <g stroke="#e9e0d0" stroke-opacity="0.22" stroke-width="1" fill="none">
    <path d="M60 0V340M1140 0V340" stroke-dasharray="3 5"/>
    <path d="M60 48H1140"/>
    <path d="M60 300H1140"/>
  </g>
  <g stroke="#e9e0d0" stroke-opacity="0.5" stroke-width="1.2">
    <path d="M54 48H66M60 42V54"/>
    <path d="M1134 48H1146M1140 42V54"/>
    <path d="M54 300H66M60 294V306"/>
    <path d="M1134 300H1146M1140 294V306"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.6" fill="#a39b8d">
    <text x="84" y="40">00 — PROFILE</text>
    <text x="1116" y="40" text-anchor="end">MUMBAI, INDIA</text>
  </g>

  <text x="84" y="186" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="78" fill="#e9e0d0" letter-spacing="-1">Ashis Wadhwani</text>

  <text x="84" y="236" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" fill="#a39b8d">Software developer. Cloud, DevOps and platform engineering.</text>

  <!-- spec columns -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.2">
    <g font-size="12" fill="#7d766a">
      <text x="84" y="324">NOW</text>
      <text x="440" y="324">RUNS</text>
      <text x="770" y="324">SITE</text>
    </g>
    <g font-size="14" fill="#e9e0d0" letter-spacing="0.4">
      <text x="130" y="324">Software Developer 1, BizDateUp</text>
      <text x="486" y="324">AWS, Terraform, escanor</text>
      <text x="812" y="324">ashiswadhwani.in</text>
